[package]
name = "meincms_backup"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
quick-xml = { version = "0.41", features = ["serialize"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "derive"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
meincms_parser = { path = "../meincms_parser" }
